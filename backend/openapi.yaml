openapi: 3.0.3
info:
  title: Robô Cestinha API
  version: 0.1.0
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Check API health
      responses:
        '200':
          description: API is healthy and can reach the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
  /sessions:
    post:
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '422':
          description: Validation error.
  /bracket/{session_hash}:
    get:
      summary: Get a session bracket or its empty skeleton
      parameters:
        - name: session_hash
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bracket rounds, assigned teams, and generation permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BracketResponse'
        '404':
          description: Session not found.
    post:
      summary: Generate a session bracket
      parameters:
        - name: session_hash
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateBracketRequest'
      responses:
        '200':
          description: Bracket generated and saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BracketResponse'
        '403':
          description: Requester is not the session owner.
        '404':
          description: Session not found.
        '409':
          description: Bracket already generated.
        '422':
          description: Not enough teams are available.
  /matches/stream:
    get:
      summary: Stream live match events
      description: Streams a randomized demo match using Server-Sent Events.
      parameters:
        - name: match_id
          in: query
          required: false
          schema:
            type: string
            default: demo
          description: Match identifier included in the stream snapshot.
      responses:
        '200':
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE messages with a JSON event envelope.
        '422':
          description: Invalid match identifier.
components:
  schemas:
    HealthCheckResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    CreateSessionRequest:
      type: object
      required:
        - owner_name
      properties:
        owner_name:
          type: string
          description: Display name for the session owner.
          example: Alice
    CreateSessionResponse:
      type: object
      required:
        - session_hash
        - owner_user_id
      properties:
        session_hash:
          type: string
          description: Public session identifier.
          example: ABCDEFGH
        owner_user_id:
          type: string
          format: uuid
          description: Database ID of the owner user.
    GenerateBracketRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
    BracketResponse:
      type: object
      required:
        - generated
        - can_generate
        - rounds
      properties:
        generated:
          type: boolean
        can_generate:
          type: boolean
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/BracketRound'
    BracketRound:
      type: object
      required:
        - round_number
        - matches
      properties:
        round_number:
          type: integer
        matches:
          type: array
          items:
            $ref: '#/components/schemas/BracketMatch'
    BracketMatch:
      type: object
      required:
        - match_id
        - slot
        - home_team
        - away_team
      properties:
        match_id:
          type: string
          format: uuid
          nullable: true
        slot:
          type: integer
        home_team:
          allOf:
            - $ref: '#/components/schemas/BracketTeam'
          nullable: true
        away_team:
          allOf:
            - $ref: '#/components/schemas/BracketTeam'
          nullable: true
    BracketTeam:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
