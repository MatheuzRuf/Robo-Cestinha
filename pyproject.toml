[project]
name = "robo-cestinha-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "python-dotenv>=1.0",
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "nba-api>=1.11.4",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "pydantic>=2.9",
    "pyarrow>=25.0.1",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/app"]
